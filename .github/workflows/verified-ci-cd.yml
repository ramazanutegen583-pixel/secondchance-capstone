name: SecondChance verified CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-and-deploy:
    name: Verify MongoDB APIs and deploy the landing page
    runs-on: [self-hosted, windows, x64, secondchance-proof]
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate implemented source files
        run: pnpm check
      - name: Import and verify 16 real MongoDB documents
        run: node scripts/import-proof.cjs
      - name: Run MongoDB API and Natural sentiment integration tests
        run: pnpm test
      - name: Build landing page and catalog
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: SecondChance CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secondchance-pages
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Validate, import MongoDB, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      MONGO_DB: secondchance_ci
      JWT_SECRET: integration-tests-only-not-a-production-secret
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate implemented source files
        run: pnpm check
      - name: Import 16 original items into MongoDB
        run: pnpm seed
      - name: Run MongoDB API and sentiment integration tests
        run: pnpm test
      - name: Build landing page and sample catalog
        run: pnpm build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy landing page to GitHub Pages
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
